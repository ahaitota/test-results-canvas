name: Test report

# Runs after CI on the trusted main branch, so it has the write token that
# fork PR workflows are denied. Publishes the Check runs from CI's artifacts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Publish test reports
    runs-on: ubuntu-latest
    # Only when CI actually ran the tests (skip cancelled runs with no artifacts).
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # One report per matrix artifact; $1 is the captured node version.
      - name: Publish unit test report
        uses: dorny/test-reporter@v1
        with:
          artifact: /unit-test-results-(.*)/
          name: Unit tests (Node $1)
          path: '**/unit-junit.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Publish e2e test report
        uses: dorny/test-reporter@v1
        with:
          artifact: playwright-report
          name: Playwright e2e
          path: '**/e2e-junit.xml'
          reporter: java-junit
          fail-on-error: false
