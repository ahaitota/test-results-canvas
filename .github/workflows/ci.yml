name: CI

# Run on pushes to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Tests only read the repo and upload results as artifacts; the separate
# test-report.yml workflow publishes the Check runs.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # The TypeScript toolchain (tsc/tsx) is now a dev dependency.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # test:ci writes a JUnit XML alongside the console output.
      - name: Run unit tests
        run: npm run test:ci

      # Add the <testsuite> wrapper node:test omits, so the reporter can read it.
      - name: Normalize unit JUnit
        if: always()
        run: node --import tsx scripts/wrap-junit.ts test-results/unit-junit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.node-version }}
          path: test-results/unit-junit.xml
          if-no-files-found: warn

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2e imports the compiled server from dist/, so build first.
      - name: Build
        run: npm run build

      - name: Type-check e2e
        run: npm run typecheck:e2e

      # Emits JUnit XML (test-results/) and an HTML report (playwright-report/).
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/e2e-junit.xml
          if-no-files-found: warn
